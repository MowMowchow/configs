unbind r
bind r source-file ~/.tmux.conf

# Unbind the default prefix (Ctrl+b)
unbind C-b
# 
# # Set new prefix to Ctrl+x
set -g prefix C-s
bind-key C-s send-prefix

# screen-256color rather than tmux-256color: the tmux-256color terminfo entry
# is missing from the ncurses macOS ships and from some minimal Linux images,
# and when it is absent tmux falls back with no colour at all.
# set -g default-terminal "tmux-256color"
set -g default-terminal "screen-256color"
set -as terminal-overrides ",xterm-kitty:RGB"
set -as terminal-features ",xterm-kitty:clipboard"

# Preserve the outer terminal's identity through tmux so tools that probe it
# (Claude Code, for one) can detect kitty and use split-pane mode.
set -ga update-environment "TERM_PROGRAM TERM_PROGRAM_VERSION"

set -g mouse on
setw -g mode-keys vi

# Clipboard, chosen by what the host actually has.
#
# Where a local clipboard tool exists (a desktop), pipe straight to it and
# leave set-clipboard off. Where none does — a remote server or container,
# which is the common case for this config — fall back to OSC 52 so the copy
# travels back through the terminal to whichever machine you are sitting at.
#
# Getting this wrong is silent: copy-command was previously hardcoded to
# pbcopy, so on Linux copy-mode piped into a command that does not exist and
# nothing was ever copied, with no error.
set -s set-clipboard off
if-shell 'command -v pbcopy  >/dev/null' 'set -s copy-command "pbcopy"'
if-shell 'command -v wl-copy >/dev/null' 'set -s copy-command "wl-copy"'
if-shell 'command -v xclip   >/dev/null && ! command -v wl-copy >/dev/null && ! command -v pbcopy >/dev/null' \
         'set -s copy-command "xclip -selection clipboard -in"'
# No local clipboard at all: let tmux emit OSC 52 instead. kitty accepts it
# because jhou-common.conf sets clipboard_control write-clipboard.
if-shell '! command -v pbcopy >/dev/null && ! command -v wl-copy >/dev/null && ! command -v xclip >/dev/null' \
         'set -s set-clipboard on'

# Vi-style copy-mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# copy-pipe with no argument uses copy-command, set above, so this follows
# the platform instead of pinning pbcopy a second time.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

set -g base-index 1 
setw -g pane-base-index 1
set-option -g status-position top

bind '=' split-window -h
bind '-' split-window -v
unbind ';' 
bind ';' last-window
bind-key & kill-window

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key x kill-pane

# set-option -g automatic-rename on
# set-option -g automatic-rename-format ' #{b:pane_current_path}'
# set -g automatic-rename-format \
# "#{?#{m:#{pane_current_command},^(?:bash|zsh|fish)$},\
#   #{?#{==:#{pane_current_path:t},},root,#{pane_current_path:t}},\
#   #{?#{==:#{pane_current_path:t},},root,#{pane_current_path:t}}/#{pane_current_command}}"
# set -g window-status-format " #{window_name}"
# set -g window-status-current-format " #{window_name}"

# Disable tmux's built-in automatic window renaming since it's handled by the shell hook
set -g automatic-rename off

# Optional: Set the window status format to display the window name (truncated to 20 characters)
set -g window-status-format " #{window_name:0:20}"
set -g window-status-current-format " #{window_name:0:20}"

# TPM configuration 
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'ofirgall/tmux-window-name'
# set -g @tmux_window_name_shells "['bash', 'fish', 'sh', 'zsh']"
# set -g @tmux_window_dir_programs "['nvim', 'vim', 'vi', 'git']"

# Catppuccin plugin is installed but NOT auto-loaded via TPM.
# theme-manager is the sole owner of tmux theming — it runs the
# catppuccin plugin when needed, or sets gruvbox colors directly.
# set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_text "#W"

set -g status-left ""
set -g status-right-length 100

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Apply theme after TPM — theme-manager is the single source of truth.
# Where the binary exists it drives tmux directly. Everywhere else
# theme-apply.sh sources the generated palette confs and installs
# the hooks that keep the status bar following the Mac's appearance.
if-shell "[ -x $HOME/.local/bin/theme-manager ]" \
  "run-shell \"$HOME/.local/bin/theme-manager apply 2>/tmp/theme-manager-tmux-init.err\"" \
  "run-shell \"$HOME/.config/tmux/theme-apply.sh --init 2>/tmp/theme-apply.err\""
