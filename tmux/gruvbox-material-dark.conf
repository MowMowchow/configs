# Gruvbox Material Dark theme for tmux
set -g status-style "bg=#32302f,fg=#d4be98"
set -g window-status-current-style "bg=#7daea3,fg=#282828,bold"
set -g window-status-style "bg=#32302f,fg=#a89984"
set -g pane-border-style "fg=#5a524c"
set -g pane-active-border-style "fg=#7daea3"
set -g message-style "bg=#32302f,fg=#d4be98"
set -g status-left ""
set -g status-right "#[fg=#282828,bg=#89b482] session: #S "
