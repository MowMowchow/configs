# Gruvbox Light theme for tmux
set -g status-style "bg=#ebdbb2,fg=#3c3836"
set -g window-status-current-style "bg=#076678,fg=#fbf1c7,bold"
set -g window-status-style "bg=#ebdbb2,fg=#7c6f64"
set -g pane-border-style "fg=#d5c4a1"
set -g pane-active-border-style "fg=#076678"
set -g message-style "bg=#ebdbb2,fg=#3c3836"
set -g status-left ""
set -g status-right "#[fg=#fbf1c7,bg=#427b58] session: #S "
