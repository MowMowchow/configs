# Gruvbox Dark theme for tmux
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g window-status-current-style "bg=#458588,fg=#282828,bold"
set -g window-status-style "bg=#3c3836,fg=#a89984"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#83a598"
set -g message-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left ""
set -g status-right "#[fg=#282828,bg=#689d6a] session: #S "
