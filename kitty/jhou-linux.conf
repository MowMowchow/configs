# Linux-only overrides. Loaded by jhou.conf when uname -s == Linux.
#
# Linux has no Cmd key, so we mirror the macOS bindings using Ctrl+Alt+ as
# the modifier — rarely bound by terminal apps and never by zsh or tmux.
# Bindings send the tmux prefix (Ctrl+S = \x13) followed by a key.

# ~~~~~~~~~~~~~~~~~~~~ KEY BINDINGS ~~~~~~~~~~~~~~~~~~~~

# Ctrl+Alt+F: search scrollback via show_scrollback (paged) and search prompt
map ctrl+alt+f combine : show_scrollback : send_text normal,application /

# Ctrl+Alt+1..9: switch to tmux window N
map ctrl+alt+1 send_text all \x131
map ctrl+alt+2 send_text all \x132
map ctrl+alt+3 send_text all \x133
map ctrl+alt+4 send_text all \x134
map ctrl+alt+5 send_text all \x135
map ctrl+alt+6 send_text all \x136
map ctrl+alt+7 send_text all \x137
map ctrl+alt+8 send_text all \x138
map ctrl+alt+9 send_text all \x139

# Splits
map ctrl+alt+shift+equal send_text all \x13=
map ctrl+alt+shift+minus send_text all \x13-

# Window management
map ctrl+alt+shift+c send_text all \x13x
map ctrl+alt+shift+n send_text all \x13c
map ctrl+alt+shift+w send_text all \x13&

# Window navigation
map ctrl+alt+n send_text all \x13n
map ctrl+alt+p send_text all \x13p
map ctrl+alt+l send_text all \x13;

# Pane navigation
map ctrl+alt+shift+j send_text all \x13j
map ctrl+alt+shift+k send_text all \x13k
map ctrl+alt+shift+l send_text all \x13l
map ctrl+alt+shift+h send_text all \x13h
