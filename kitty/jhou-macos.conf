# macOS-only overrides. Loaded by jhou.conf when uname -s == Darwin.
#
# Bindings send the tmux prefix (Ctrl+S = \x13) followed by a key so that
# Cmd-shortcuts feel native to the Mac while driving tmux underneath.

# ~~~~~~~~~~~~~~~~~~~~ APPEARANCE ~~~~~~~~~~~~~~~~~~~~
# Titlebar matches terminal background (works with auto-switching)
macos_titlebar_color background

# ~~~~~~~~~~~~~~~~~~~~ KEY BINDINGS ~~~~~~~~~~~~~~~~~~~~

# Cmd+F: search scrollback via show_scrollback (paged) and search prompt
map cmd+f combine : show_scrollback : send_text normal,application /

# Cmd+1..9: switch to tmux window N
map cmd+1 send_text all \x131
map cmd+2 send_text all \x132
map cmd+3 send_text all \x133
map cmd+4 send_text all \x134
map cmd+5 send_text all \x135
map cmd+6 send_text all \x136
map cmd+7 send_text all \x137
map cmd+8 send_text all \x138
map cmd+9 send_text all \x139

# Splits (Shift+Cmd+= for vertical, Shift+Cmd+- for horizontal)
map cmd+shift+= send_text all \x13=
map cmd+shift+- send_text all \x13-

# Window management
map cmd+shift+c send_text all \x13x
map cmd+shift+n send_text all \x13c
map cmd+shift+w send_text all \x13&

# Window navigation
map cmd+n send_text all \x13n
map cmd+p send_text all \x13p
map cmd+l send_text all \x13;

# Pane navigation
map shift+cmd+j send_text all \x13j
map shift+cmd+k send_text all \x13k
map shift+cmd+l send_text all \x13l
map shift+cmd+h send_text all \x13h
