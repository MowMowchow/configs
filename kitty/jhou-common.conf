# Cross-platform kitty overrides. macOS- and Linux-specific bindings live in
# jhou-macos.conf / jhou-linux.conf, dispatched by jhou.conf via geninclude.

# ~~~~~~~~~~~~~~~~~~~~ SCROLLBACK ~~~~~~~~~~~~~~~~~~~~
scrollback_lines 25000

# ~~~~~~~~~~~~~~~~~~~~ THEME ~~~~~~~~~~~~~~~~~~~~
# Theme handled by theme-manager: it writes dark-theme.auto.conf and
# light-theme.auto.conf, which kitty 0.36+ auto-selects by system appearance.
# include themes/mocha.conf
# include themes/latte.conf

# ~~~~~~~~~~~~~~~~~~~~ FONT ~~~~~~~~~~~~~~~~~~~~
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0
# text_composition_strategy legacy
