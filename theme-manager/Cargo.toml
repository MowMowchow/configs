[package]
name = "theme-manager"
version = "0.1.0"
edition = "2021"
description = "Unified theme manager (macOS + Linux) for kitty, neovim, and tmux"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
glob = "0.3"
dirs = "6"
