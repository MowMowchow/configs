[package]
name = "theme-manager"
version = "0.1.0"
edition = "2021"
description = "Unified macOS theme manager for kitty, neovim, tmux, and spicetify"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
glob = "0.3"
dirs = "6"
