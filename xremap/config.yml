# macOS-style Super-key shortcuts on Linux GNOME (X11).
# Driven by xremap (https://github.com/xremap/xremap), which intercepts
# keys at the evdev layer and emits replacement events via uinput.
#
# Design:
# - Generic apps: Super behaves like macOS Command (Super+C → Ctrl+C, etc.).
# - Terminal apps (regex match on WM_CLASS): Super+C/V/T/W/N/F/A become
#   Ctrl+Shift+C/V/T/W/N/F/A so terminal-native copy/paste/new-tab work
#   AND Ctrl+C still interrupts the foreground process.
# - Dangerous terminal mappings (Super+S/Z/X) are dropped to []  — the
#   xremap idiom for "swallow the key" — to avoid Ctrl+S freezing output,
#   Ctrl+Z suspending a job, or Ctrl+X clobbering a buffer.
#
# See docs/keybinds-linux.md for the full runbook (install, GNOME tweaks,
# rollback, debugging, how to extend).

keymap:
  # Terminal-specific overrides MUST come first. xremap evaluates keymap
  # blocks in order and uses the first match, so app-scoped blocks need to
  # sit above the unscoped fallback.
  - name: Terminal — macOS-style shortcuts
    application:
      only:
        - /kitty/
        - /Alacritty/
        - /gnome-terminal/
        - /org\.gnome\.Terminal/
        - /org\.gnome\.Console/
        - /kgx/
        - /wezterm/
        - /WezTerm/
        - /com\.mitchellh\.ghostty/
        - /foot/
    # Modifier set must match exactly. Without this, xremap's default of
    # exact_match=false would let `Super-n` (mapped to Ctrl+Shift+N → new
    # kitty window) also fire when the user presses Super+Shift+N — which
    # would shadow the more specific `Super-Shift-n` rule below.
    exact_match: true
    remap:
      # Terminal-native copy/paste/new-tab/close-tab/find/select-all.
      Super-c: C-Shift-c
      Super-v: C-Shift-v
      Super-t: C-Shift-t
      Super-w: C-Shift-w
      Super-f: C-Shift-f
      Super-a: C-Shift-a

      # Terminal-native: clear, reverse-history-search, close window.
      Super-l: C-l
      Super-r: C-r
      Super-q: Alt-F4

      # tmux window management. List-form values send a sequence of
      # chords: tmux prefix (Ctrl+S, set in tmux.conf) followed by the
      # tmux command-key. xremap operates at evdev scancodes, not
      # characters, so '&' (kill-window) is sent as Shift-7 — the
      # physical key combo that produces '&' on US layout.
      Super-n: [C-s, n]              # next tmux window     (prefix + n)
      Super-p: [C-s, p]              # previous tmux window (prefix + p)
      Super-Shift-n: [C-s, c]        # new tmux window      (prefix + c)
      Super-Shift-w: [C-s, Shift-7]  # kill tmux window     (prefix + &)

      # tmux switch-to-window N (Super+1..9). Mirrors the macOS
      # Cmd+1..9 bindings in jhou-macos.conf.
      Super-1: [C-s, '1']
      Super-2: [C-s, '2']
      Super-3: [C-s, '3']
      Super-4: [C-s, '4']
      Super-5: [C-s, '5']
      Super-6: [C-s, '6']
      Super-7: [C-s, '7']
      Super-8: [C-s, '8']
      Super-9: [C-s, '9']

      # Drop these — typing them as Ctrl-X would break the shell:
      #   Ctrl-S freezes terminal output (XOFF)
      #   Ctrl-Z suspends the foreground job
      #   Ctrl-X clobbers Readline's prefix
      Super-s: []
      Super-z: []
      Super-x: []

  # Fallback for everything else (browsers, editors, file managers, …).
  - name: Global — macOS-style shortcuts
    exact_match: true
    remap:
      Super-c: C-c
      Super-v: C-v
      Super-x: C-x
      Super-a: C-a

      Super-z: C-z
      Super-Shift-z: C-Shift-z

      Super-s: C-s
      Super-o: C-o
      Super-p: C-p
      Super-f: C-f

      Super-t: C-t
      Super-w: C-w
      Super-r: C-r
      Super-l: C-l
      Super-n: C-n

      Super-q: Alt-F4

      # Super+1..9 → Ctrl+1..9, matching macOS Cmd+1..9 semantics:
      # in browsers (Chrome/Firefox/Safari), Cmd+1..9 jumps to tab N;
      # the Linux equivalent is Ctrl+1..9. xremap intercepts before
      # GNOME, so GNOME's "switch-to-application-N" dock binding is
      # bypassed entirely without needing a gsettings override.
      Super-1: C-1
      Super-2: C-2
      Super-3: C-3
      Super-4: C-4
      Super-5: C-5
      Super-6: C-6
      Super-7: C-7
      Super-8: C-8
      Super-9: C-9
